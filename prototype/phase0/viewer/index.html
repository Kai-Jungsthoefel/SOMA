<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Phase-0-Viewer</title>
<style>
  html, body { margin: 0; height: 100%; font: 13px system-ui, sans-serif; background: #1e2227; color: #dde; }
  #app { display: grid; grid-template-columns: 220px 1fr 380px; height: 100%; }
  #tree, #side { padding: 8px; overflow: auto; background: #262b31; }
  #view { position: relative; min-width: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  h3 { margin: 4px 0 8px; font-size: 12px; text-transform: uppercase; color: #8a94a3; }
  label { display: block; padding: 2px 0; cursor: pointer; }
  .ref { color: #7fd1a0; }
  #info { padding: 8px; background: #1e2227; border-radius: 4px; margin-bottom: 8px; min-height: 60px; }
  pre { margin: 0; font: 12px ui-monospace, Consolas, monospace; }
  .ln { display: block; white-space: pre; padding: 0 4px; color: #8a94a3; }
  .ln.hl { background: #5a4a10; color: #ffe89a; }
</style>
</head>
<body>
<div id="app">
  <div id="tree"><h3>Modell</h3><div id="parts"></div></div>
  <div id="view"></div>
  <div id="side"><h3>Auswahl</h3><div id="info">Klick auf ein Bauteil.</div><h3>Code</h3><pre id="code"></pre></div>
</div>
<script type="importmap">
{ "imports": { "three": "../node_modules/three/build/three.module.js",
               "three/addons/": "../node_modules/three/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const params = new URLSearchParams(location.search);
const project = params.get('project') || 'example';
const base = `../${project}/`;

const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(devicePixelRatio);
view.appendChild(renderer.domElement);

THREE.Object3D.DEFAULT_UP.set(0, 0, 1);            // CAD: Z oben, Einheit mm
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1e2227);
const camera = new THREE.PerspectiveCamera(35, 1, 0.5, 5000);
camera.up.set(0, 0, 1);
const controls = new OrbitControls(camera, renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(80, -120, 200); scene.add(sun);

function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const parts = new Map();   // partId -> { group, meta, meshes[], box }
let mapJson = null, codeLines = [], codeFile = '';
const highlight = new THREE.Group(); scene.add(highlight);
window.__cadide = { ready: false, lastPick: null };

async function load() {
  mapJson = await (await fetch(base + '.cadide/model.map.json')).json();
  const gltf = await new GLTFLoader().loadAsync(base + '.cadide/model.glb');
  scene.add(gltf.scene);
  gltf.scene.traverse(o => {
    const meta = o.userData && o.userData.cadide;
    if (!meta) return;
    const meshes = [];
    o.traverse(c => { if (c.isMesh) meshes.push(c); });
    // Flaechen minimal nach hinten schieben, damit die Kantenlinien nicht mit ihnen um die Tiefe kaempfen
    meshes.forEach(m => { m.material.polygonOffset = true; m.material.polygonOffsetFactor = 1; m.material.polygonOffsetUnits = 1; });
    if (meta.role === 'reference') meshes.forEach(m => { m.material.depthWrite = false; m.renderOrder = 1; });
    parts.set(meta.partId, { group: o, meta, meshes });
  });
  buildTree();
  const box = new THREE.Box3().setFromObject(gltf.scene);
  const c = box.getCenter(new THREE.Vector3()), r = box.getSize(new THREE.Vector3()).length();
  controls.target.copy(c); camera.position.copy(c).add(new THREE.Vector3(0.8, -1.2, 0.9).multiplyScalar(r * 0.9));
  controls.update();
  window.__cadide.ready = true;
}

function buildTree() {
  const el = document.getElementById('parts');
  for (const [id, p] of parts) {
    const l = document.createElement('label');
    if (p.meta.role === 'reference') l.className = 'ref';
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = true;
    cb.onchange = () => { p.group.visible = cb.checked; };
    l.append(cb, ' ' + p.meta.name + (p.meta.role === 'reference' ? ' (Referenz)' : ''));
    el.append(l);
  }
}

// --- Picking: Dreiecksindex -> Flaeche (Binaersuche in faces[triStart..])
function faceOfTriangle(meta, tri) {
  const f = meta.faces; let lo = 0, hi = f.length - 1, ans = -1;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (f[m].triStart <= tri) { ans = m; lo = m + 1; } else hi = m - 1; }
  while (ans >= 0 && !(tri < f[ans].triStart + f[ans].triCount)) ans--;   // Flaechen ohne Dreiecke ueberspringen
  return ans >= 0 ? f[ans] : null;
}

const ray = new THREE.Raycaster();
function pickAt(ndcX, ndcY) {
  ray.setFromCamera({ x: ndcX, y: ndcY }, camera);
  const meshes = [];
  for (const p of parts.values()) if (p.group.visible) meshes.push(...p.meshes);
  const hit = ray.intersectObjects(meshes, false)[0];
  if (!hit) { select(null); return null; }
  let part = null;
  for (const p of parts.values()) if (p.meshes.includes(hit.object)) part = p;
  const face = faceOfTriangle(part.meta, hit.faceIndex);
  const entry = mapJson.parts.find(x => x.id === part.meta.partId);
  const result = { partId: part.meta.partId, name: part.meta.name, role: part.meta.role,
                   faceId: face ? face.id : null, surface: face ? face.surface : null, area: face ? face.area : null,
                   file: entry && entry.file, line: entry && entry.line, endLine: entry && entry.end_line,
                   point: hit.point.toArray().map(v => +v.toFixed(3)) };
  select(result, part, face);
  return result;
}

async function select(res, part, face) {
  window.__cadide.lastPick = res;
  highlight.clear();
  const info = document.getElementById('info'), code = document.getElementById('code');
  if (!res) { info.textContent = 'Nichts getroffen.'; code.textContent = ''; return; }
  info.innerHTML = `<b>${res.name}</b>${res.role === 'reference' ? ' (Referenz)' : ''}<br>` +
    `Fläche f${res.faceId} · ${res.surface} · ${res.area} mm²<br>` +
    (res.file ? `Code: ${res.file}:${res.line}` + (res.endLine !== res.line ? `–${res.endLine}` : '') : 'Basismodus: kein Code-Bezug');
  // Flaeche hervorheben: Dreiecksbereich als Overlay-Mesh
  const m = part.meshes.find(x => x.geometry.index);
  if (m && face && face.triCount) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', m.geometry.getAttribute('position'));
    g.setIndex(Array.from(m.geometry.index.array.slice(face.triStart * 3, (face.triStart + face.triCount) * 3)));
    const o = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color: 0xffa000, polygonOffset: true,
      polygonOffsetFactor: -2, polygonOffsetUnits: -2, side: THREE.DoubleSide, depthTest: true }));
    o.applyMatrix4(m.matrixWorld); o.renderOrder = 2; highlight.add(o);
  }
  // Code zeigen, Aufrufzeilen markieren
  if (!res.file) { code.textContent = ''; return; }
  if (!codeLines.length || codeFile !== res.file) {
    codeFile = res.file;
    codeLines = (await (await fetch(base + res.file)).text()).split(/\r?\n/);
  }
  const from = Math.max(1, res.line - 6), to = Math.min(codeLines.length, (res.endLine || res.line) + 6);
  code.innerHTML = '';
  for (let i = from; i <= to; i++) {
    const s = document.createElement('span');
    s.className = 'ln' + (i >= res.line && i <= (res.endLine || res.line) ? ' hl' : '');
    s.textContent = String(i).padStart(3) + '  ' + codeLines[i - 1];
    code.append(s);
  }
}

// Klick ohne Ziehen
let down = null;
renderer.domElement.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 4) return;
  const r = renderer.domElement.getBoundingClientRect();
  pickAt(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
});

// Testschnittstelle fuer die automatische Pruefung
window.__cadide.pickAt = pickAt;
window.__cadide.screenOf = (partId, faceId) => {          // Bildschirmposition (Pixel) des Flaechenmittelpunkts
  const p = parts.get(partId); const f = p.meta.faces.find(x => x.id === faceId);
  const v = new THREE.Vector3(...f.center).project(camera); const r = renderer.domElement.getBoundingClientRect();
  return { x: r.left + (v.x + 1) / 2 * r.width, y: r.top + (1 - v.y) / 2 * r.height };
};
window.__cadide.faces = (partId) => parts.get(partId).meta.faces;
window.__cadide.parts = () => [...parts.values()].map(p => ({ id: p.meta.partId, faces: p.meta.faces.length, edges: p.meta.edges.length }));

renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
load().catch(e => { document.getElementById('info').textContent = 'Fehler: ' + e; console.error(e); });
</script>
</body>
</html>
