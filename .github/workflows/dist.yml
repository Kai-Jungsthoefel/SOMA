# Installationspakete für Windows, Linux und macOS. Jedes System baut sein eigenes Paket: Python-Basisumgebung, CalculiX
# und das Git von dugite sind plattformabhängig. Ablauf und Grenzen in app/README.md („Installationspakete“).
#
# Start von Hand (Actions > Installers > Run workflow) oder mit einem Versions-Tag (vX.Y.Z). Die Pakete liegen danach als
# Artefakte am Lauf, bei einem Tag zusätzlich als GitHub-Release (Job release unten). Ohne Zertifikate: Windows unsigniert (SmartScreen warnt), macOS nur ad-hoc signiert, nicht notarisiert.
name: Installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  dist:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            exe: release/win-unpacked/SOMA.exe
            files: app/release/*.exe
          # 22.04 statt neuer: Das Paket läuft nur auf Systemen mit mindestens dieser glibc
          - os: ubuntu-22.04
            exe: release/linux-unpacked/soma-app
            files: |
              app/release/*.AppImage
              app/release/*.tar.gz
          # Apple Silicon (für Intel-Macs fehlen Wheels der Basisumgebung)
          - os: macos-15
            exe: release/mac-arm64/SOMA.app/Contents/MacOS/SOMA
            files: app/release/*.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Gleiche uv-Version wie in der Entwicklung: Sie bestimmt, welches Python 3.12.x build_runtime.py bekommt
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.22'

      - name: npm ci
        working-directory: app
        run: npm ci

      - name: Typecheck und Unit-Tests
        working-directory: app
        run: |
          npm run typecheck
          npm run test:unit

      # Bibliotheken, die build_runtime.py für gmsh mitliefert (LINUX_BUNDLE), müssen auf dem Runner da sein
      - name: Bibliotheken für gmsh
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libxft2 libxinerama1 libxcursor1

      # Der Linux-Runner hat nur rund 14 GB frei. Die Basisumgebung (1,4 GB) liegt beim Packen mehrfach auf der Platte
      # (python-runtime, linux-unpacked, AppImage-Zwischenordner, AppImage und tar.gz), mksquashfs brach in 0.7.0 mit
      # „No space left on device“ ab. Vorinstallierte Werkzeuge, die SOMA nicht braucht, schaffen rund 20 GB Platz.
      - name: Speicherplatz freigeben (Linux)
        if: runner.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Python-Basisumgebung
        run: uv run --no-project --python 3.12 python python/scripts/build_runtime.py

      - name: Installationspaket
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run dist
          df -h . || true

      # Das Fenster der App ist 1600 × 950 groß, Windows begrenzt es auf den Bildschirm (Runner: 1024 × 768). Prüfungen
      # mit Koordinaten im Viewer (Ansichtswürfel, Raster, Doppelklick) brauchen die volle Größe.
      - name: Bildschirmauflösung (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force

      # Prüfung der gepackten App mit der Smoke-Suite. Unter macOS bricht der Lauf nicht ab. macOS: Der Bildschirm des Runners lässt sich
      # nicht vergrößern, die Prüfungen mit Koordinaten im Viewer (Würfel, Raster, Doppelklick) scheitern dort.
      # Linux: xvfb hat nur den Software-Renderer llvmpipe, für den Chromium WebGL sperrt. Die App startet sich dann einmal
      # mit --ignore-gpu-blocklist neu und merkt sich das (main.ts). Der Test legt den Merker vorab an, über einen Neustart
      # hinweg kann er dem Fenster nicht folgen.
      - name: Smoke-Test der gepackten App
        working-directory: app
        continue-on-error: ${{ runner.os == 'macOS' }}
        env:
          SOMA_TEST_EXE: ${{ github.workspace }}/app/${{ matrix.exe }}
          SOMA_TEST_SOFTWARE_GL: ${{ runner.os == 'Linux' && '1' || '' }}
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a --server-args='-screen 0 1920x1080x24' node test/smoke.mjs; else node test/smoke.mjs; fi

      - uses: actions/upload-artifact@v4
        with:
          name: SOMA-${{ runner.os }}
          path: ${{ matrix.files }}
          retention-days: 14
          compression-level: 0

  # Bei einem Versions-Tag: GitHub-Release mit den Paketen aller Systeme. Läuft nur, wenn alle drei gebaut und Windows und
  # Linux ihren Smoke-Test bestanden haben. Als Vorabversion, solange SOMA bei 0.x ist und die Pakete unsigniert sind.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: dist
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      # Text der Release-Seite auf Englisch (E73), die Änderungen stehen im Changelog
      - name: Release-Text
        run: |
          ls -l packages
          cat > notes.md <<EOF
          Early prototype of SOMA, version ${GITHUB_REF_NAME#v}. Changes: [CHANGELOG.md](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md).

          Each package brings Python with CadQuery, the \`soma\` library, CalculiX and Git. You only need a CLI agent of your choice (for example Claude Code or OpenCode).

          | System | File |
          |---|---|
          | Windows 10/11, x64 | \`SOMA-*-win-x64.exe\` (installer) |
          | macOS 11 or later, Apple Silicon | \`SOMA-*-mac-arm64.dmg\` |
          | Linux x64, glibc 2.31 or later | \`SOMA-*-linux-*.AppImage\` or \`SOMA-*-linux-*.tar.gz\` |

          The packages are not signed yet:

          - **Windows:** SmartScreen warns on the first start. Choose "More info", then "Run anyway". The installer needs no admin rights.
          - **macOS:** Move SOMA to Applications, then right-click it and choose "Open", or run \`xattr -cr /Applications/SOMA.app\` once.
          - **Linux:** Make the AppImage executable (\`chmod +x\`). Without a working graphics driver SOMA falls back to software rendering, which is slow for large models.
          EOF
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: SOMA ${{ github.ref_name }}
          body_path: notes.md
          prerelease: true
          files: packages/*
          fail_on_unmatched_files: true
