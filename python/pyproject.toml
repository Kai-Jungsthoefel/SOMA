[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soma"
version = "0.1.0"
description = "Hilfsbibliothek und Kommandozeile von SOMA"
requires-python = ">=3.11"
# cadquery liegt in der mitgelieferten Basisumgebung und wird hier bewusst nicht als Abhaengigkeit gezogen

[project.scripts]
soma = "soma.cli:main"

[tool.setuptools]
packages = ["soma"]

[tool.setuptools.package-data]
# Masstabellen der Normteile (aus bd_warehouse, Apache 2.0)
soma = ["data/fasteners/*"]
