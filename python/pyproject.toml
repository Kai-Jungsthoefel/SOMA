[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "soma"
# Versionsnummer von SOMA (E68), eine fuer App und soma: steht in soma/__init__.py und gleichlautend in app/package.json
dynamic = ["version"]
description = "Helper library and command line of SOMA"
# Lizenz von SOMA (E71), Text in LICENSE im Hauptordner des Repos
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
# cadquery liegt in der mitgelieferten Basisumgebung und wird hier bewusst nicht als Abhaengigkeit gezogen

[project.scripts]
soma = "soma.cli:main"

[tool.setuptools]
packages = ["soma"]

[tool.setuptools.dynamic]
version = { attr = "soma.__version__" }

[tool.setuptools.package-data]
# Masstabellen der Normteile (aus bd_warehouse, Apache 2.0)
soma = ["data/fasteners/*"]
