<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOMA Oberflächenentwurf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#121417; --s1:#16181c; --s2:#1b1e23; --s3:#232830; --line:#262a31; --line2:#2d323a;
  --tx:#e6e8eb; --tx2:#a3acb6; --tx3:#7f8994; --term:#0f1114;
  --acc:#f29a38; --acc-tx:#f6b46a; --acc-tint:rgba(242,154,56,.14);
  --vio:#9aa6ff; --vio-tint:rgba(154,166,255,.14);
  --ok:#5cc98b; --warn:#e8c547; --err:#f07470;
  --sans:'IBM Plex Sans','Segoe UI',system-ui,sans-serif; --mono:'IBM Plex Mono',Consolas,monospace;
  --k:1;
}
*{box-sizing:border-box}
html,body{margin:0;background:#0b0c0e;color:var(--tx);font:13px/1.4 var(--sans)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{display:block;flex-shrink:0}
b{font-weight:600}

/* Präsentation */
.deck-top{position:sticky;top:0;z-index:5;background:#0b0c0e;border-bottom:1px solid #1d2025}
.deck-head{display:flex;align-items:center;gap:18px;padding:10px 24px}
.deck-title{font-weight:600;font-size:14px;white-space:nowrap}
.deck-tabs{display:flex;gap:2px;flex-wrap:wrap}
.deck-tab{height:30px;padding:0 11px;border-radius:6px;color:var(--tx2);white-space:nowrap}
.deck-tab .n{color:var(--tx3);margin-right:6px}
.deck-tab[aria-selected=true]{background:var(--s3);color:var(--tx)}
.deck-tab[aria-selected=true] .n{color:var(--acc-tx)}
.deck-tools{margin-left:auto;display:flex;align-items:center;gap:12px;color:var(--tx3);font-size:12px;white-space:nowrap}
.deck-cap{display:flex;gap:28px;align-items:baseline;padding:4px 24px 12px}
.deck-cap h2{margin:0;font-size:17px;font-weight:600;white-space:nowrap}
.deck-cap ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:4px 22px;color:var(--tx2)}
.deck-cap li{display:flex;gap:8px}
.deck-cap li::before{content:"";width:5px;height:5px;margin-top:7px;border-radius:50%;background:var(--acc);flex-shrink:0}
.stage{padding:16px 24px 40px;display:flex;justify-content:center}
.frame{width:calc(1440px * var(--k));height:calc(900px * var(--k));flex-shrink:0}
.screen{width:1440px;height:900px;transform:scale(var(--k));transform-origin:0 0;border-radius:10px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 0 1px #262a31}
body.solo .deck-top{display:none}
body.solo .stage{padding:0}
body.solo .screen{border-radius:0;box-shadow:none}

/* App */
.app{width:1440px;height:900px;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;position:relative}
.top{height:44px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding-right:12px;background:var(--s1);border-bottom:1px solid var(--line)}
.logo{width:60px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--acc);flex-shrink:0}
.docname{display:flex;align-items:center;gap:6px;height:30px;padding:0 8px;margin-left:-8px;border-radius:6px;color:var(--tx2)}
.docname b{font-size:14px;color:var(--tx)}
.savestate{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--tx2);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block}
.grow{flex-grow:1}
.c2{color:var(--tx2)} .c3{color:var(--tx3)}
.pill{display:flex;align-items:center;height:30px;border:1px solid var(--line2);border-radius:15px;background:var(--s2);white-space:nowrap}
.pill.err{border-color:rgba(240,116,112,.5);background:rgba(240,116,112,.08)}
.pill .main{display:flex;align-items:center;gap:8px;height:28px;padding:0 12px;border-radius:15px 0 0 15px}
.pill .sep{width:1px;height:16px;background:var(--line2)}
.pill .auto{display:flex;align-items:center;gap:6px;height:28px;padding:0 12px 0 10px;color:var(--tx2);border-radius:0 15px 15px 0}
.pill .inner{height:22px;padding:0 8px;border-radius:11px;font-size:12px;border:1px solid var(--line2);display:flex;align-items:center}
.btn{display:flex;align-items:center;gap:7px;height:30px;padding:0 10px;border:1px solid var(--line2);border-radius:6px;white-space:nowrap}
.btn.sm{height:28px;padding:0 9px;font-size:12px;gap:6px}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#1b1206;font-weight:600;gap:10px;padding:0 12px}
.btn.primary .kbd{font-size:11px;font-weight:500;color:#5a3a12}
.btn.acc{background:var(--acc-tint);border-color:rgba(242,154,56,.45);color:var(--acc-tx);font-weight:500}
.btn.vio{background:var(--vio);border-color:var(--vio);color:#141733;font-weight:600}
.btn.ghost{border-color:transparent}
.btn[disabled]{color:#5d6671;border-color:var(--line);cursor:default}
.ibtn{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:var(--tx2);flex-shrink:0}
.ibtn.s{width:26px;height:26px}
.body{flex-grow:1;display:flex;min-height:0}
.rail{width:60px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;background:var(--s1);border-right:1px solid var(--line)}
.rail button{width:50px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:8px;color:var(--tx2)}
.rail button span{font-size:10.5px}
.rail button.on{background:var(--s3);color:var(--acc-tx)}
.center{flex-grow:1;min-width:0;display:flex;flex-direction:column}
.vp{flex-grow:1;position:relative;overflow:hidden;background:radial-gradient(ellipse at 52% 44%,#272c34 0%,#1b1e23 60%,#16181c 100%)}
.float{position:absolute;background:rgba(24,27,31,.95);border:1px solid var(--line2);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.parts{left:12px;top:12px;width:228px;overflow:hidden}
.parts .hd{height:36px;display:flex;align-items:center;gap:6px;padding:0 6px 0 12px}
.parts .list{padding:4px 0 6px;border-top:1px solid var(--line)}
.row{display:flex;align-items:center;height:28px;padding:0 6px 0 4px}
.row .nm{flex-grow:1;display:flex;align-items:center;gap:9px;height:28px;padding:0 8px;border-radius:6px;text-align:left}
.row.sel .nm{background:var(--acc-tint);color:var(--acc-tx);font-weight:500}
.row.off .nm{color:var(--tx3)}
.sw{width:10px;height:10px;border-radius:3px;flex-shrink:0;display:inline-block}
.eye{width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:var(--tx3)}
.grp{padding:10px 12px 4px;font-size:11px;letter-spacing:.06em;color:var(--tx3)}
.dock{top:12px;left:256px;display:flex;align-items:center;gap:2px;padding:4px}
.dock button{display:flex;align-items:center;gap:7px;height:32px;padding:0 10px;border-radius:7px;white-space:nowrap}
.dock.icons button{padding:0 8px;gap:3px}
.dock button.hot{background:var(--acc-tint);color:var(--acc-tx);font-weight:500}
.vsep{width:1px;height:20px;background:var(--line2);margin:0 3px;flex-shrink:0}
.cube{position:absolute;top:12px;right:14px;display:flex;flex-direction:column;align-items:center;gap:8px}
.vbtns{display:flex;flex-direction:column;gap:2px;padding:3px;background:rgba(24,27,31,.95);border:1px solid var(--line2);border-radius:9px}
.vbtns button{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:#c9ced4}
.selcard{left:12px;bottom:12px;width:356px;overflow:hidden}
.selcard .code{font-size:11px}
.code{font-family:var(--mono);font-size:11.5px;line-height:1.65}
.cl{display:flex;gap:12px;padding:0 10px;white-space:pre}
.cl .ln{color:#5d6671;min-width:18px;text-align:right;flex-shrink:0}
.cl.hl{background:rgba(242,154,56,.11)}
.cl.er{background:rgba(240,116,112,.15)}
.k-fn{color:#7fb4ff}.k-str{color:#9fd28a}.k-num{color:#e0b36a}.k-cm{color:#7f8994}.k-kw{color:#c69cf5}
.tl{height:44px;flex-shrink:0;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--s1);border-top:1px solid var(--line)}
.tl .lbl{width:84px;flex-shrink:0;display:flex;align-items:center;gap:7px;color:var(--tx2);font-size:12px;font-weight:500}
.track{position:relative;height:44px;flex-grow:1}
.track .line{position:absolute;left:8px;right:60px;top:21px;height:2px;background:var(--line2);border-radius:1px}
.vd{position:absolute;top:15px;width:14px;height:14px;margin-left:-7px;display:flex;align-items:center;justify-content:center}
.vd i{width:8px;height:8px;border-radius:50%;background:var(--tx2)}
.vd.app i{background:var(--s1);box-shadow:inset 0 0 0 2px var(--tx2)}
.vd.saved i{background:var(--ok);width:9px;height:9px}
.vd.pv i{width:12px;height:12px;background:var(--vio);box-shadow:0 0 0 4px rgba(154,166,255,.28)}
.now{position:absolute;top:13px;margin-left:-7px;height:18px;display:flex;align-items:center;gap:8px}
.now i{width:14px;height:14px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 2px var(--acc);display:flex;align-items:center;justify-content:center}
.now i::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--acc)}
.now span{font-size:12px;font-weight:500;color:var(--acc-tx)}
.agent{width:460px;flex-shrink:0;display:flex;flex-direction:column;background:var(--term);border-left:1px solid var(--line);position:relative}
.agent.collapsed{width:44px;align-items:center;background:var(--s1)}
.tabs{height:40px;flex-shrink:0;display:flex;align-items:flex-end;gap:2px;padding:0 6px 0 8px;background:var(--s1);border-bottom:1px solid var(--line)}
.tab{height:33px;display:flex;align-items:center;gap:2px;padding:0 4px 0 6px;border-radius:7px 7px 0 0;color:var(--tx2);border:1px solid transparent}
.tab.on{background:var(--term);border-color:var(--line);border-bottom-color:var(--term);margin-bottom:-1px;color:var(--tx)}
.tab .t{display:flex;align-items:center;gap:8px;height:28px;padding:0 6px}
.tab.on .t{font-weight:500}
.term{flex-grow:1;min-height:0;display:flex;flex-direction:column;padding:14px 16px;font-family:var(--mono);font-size:12.5px;line-height:1.62;color:#c9ced4;overflow:hidden}
.term .l{white-space:pre-wrap}
.term .pre{white-space:pre}
.term .gap{height:14px;flex-shrink:0}
.term .u{color:var(--tx)}
.term .p{color:var(--acc-tx)}
.term .cmd{color:#7fb4ff}
.term .ok{color:var(--ok)}
.term .mut{color:var(--tx3)}
.input{padding:10px 12px;border:1px solid var(--line2);border-radius:8px;white-space:pre-wrap;color:var(--tx)}
.cursor{display:inline-block;width:7px;height:15px;margin-left:2px;background:var(--tx);vertical-align:-3px}
.handoff{height:44px;flex-shrink:0;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--s1);border-top:1px solid var(--line)}
.toast{position:absolute;left:12px;right:12px;bottom:136px;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--s2);border:1px solid var(--line2);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.45);font-size:12.5px}
.side{flex-shrink:0;display:flex;flex-direction:column;background:var(--s1);border-right:1px solid var(--line);min-height:0}
.side-hd{height:40px;flex-shrink:0;display:flex;align-items:center;gap:4px;padding:0 6px 0 14px;border-bottom:1px solid var(--line)}
.frow{display:flex;align-items:center;gap:8px;height:26px;padding:0 8px;margin:0 6px;border-radius:6px;width:calc(100% - 12px);text-align:left;color:var(--tx)}
.frow .tag{margin-left:auto;font-size:11px;color:var(--tx3)}
.frow.dim{color:var(--tx2)}
.frow.hov{background:var(--s3)}
.ctab{height:33px;display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:7px 7px 0 0;color:var(--tx2);font-family:var(--mono);font-size:12px;align-self:flex-end;border:1px solid transparent}
.ctab.on{background:var(--term);border-color:var(--line);border-bottom-color:var(--term);margin-bottom:-1px;color:var(--tx)}

/* Menüs */
.menu{background:var(--s2);border:1px solid var(--line2);border-radius:10px;box-shadow:0 14px 40px rgba(0,0,0,.45);padding:6px;width:300px}
.mi{display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:6px;width:100%;text-align:left;white-space:nowrap}
.mi .k{margin-left:auto;color:var(--tx3);font-size:12px}
.mi.on{background:var(--s3)}
.mi.dim{color:var(--tx3)}
.msep{height:1px;background:var(--line);margin:6px 4px}
.mh{padding:8px 10px 4px;font-size:11px;letter-spacing:.06em;color:var(--tx3)}
.cap{font-size:11px;letter-spacing:.06em;color:var(--tx3);margin-bottom:10px}
.chip{height:28px;padding:0 10px;border:1px solid var(--line2);border-radius:6px;font-size:12px;display:flex;align-items:center;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:2px 10px 8px}
.switch{width:32px;height:18px;border-radius:9px;background:var(--acc);position:relative;flex-shrink:0;margin-left:auto}
.switch::after{content:"";position:absolute;top:2px;right:2px;width:14px;height:14px;border-radius:50%;background:#1b1206}
.seg{display:flex;margin:2px 10px 8px;border:1px solid var(--line2);border-radius:7px;overflow:hidden}
.seg button{flex:1;height:28px;font-size:12px;color:var(--tx2)}
.seg button.on{background:var(--s3);color:var(--tx);font-weight:500}

/* Startseite */
.bigcard{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:20px;border:1px solid var(--line2);border-radius:12px;background:var(--s2);text-align:left}
.bigcard .ico{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.recent{display:flex;flex-direction:column;border:1px solid var(--line2);border-radius:10px;background:var(--s2);overflow:hidden;text-align:left}
.recent .th{height:120px;background:radial-gradient(ellipse at 50% 45%,#272c34 0%,#1b1e23 70%);display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line)}
.recent .meta{padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.panel{border:1px solid var(--line2);border-radius:12px;background:var(--s2);overflow:hidden}
.agrow{display:flex;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<div class="deck-top">
  <div class="deck-head">
    <span class="deck-title">SOMA · Oberflächenentwurf</span>
    <nav class="deck-tabs" id="tabs" aria-label="Ansichten"></nav>
    <span class="deck-tools"><span>Pfeiltasten blättern · einige Knöpfe sind klickbar</span><button class="btn sm" id="zoom">Originalgröße</button></span>
  </div>
  <div class="deck-cap"><h2 id="cap-title"></h2><ul id="cap-list"></ul></div>
</div>
<div class="stage"><div class="frame"><div class="screen" id="screen"></div></div></div>

const params = new URLSearchParams(location.search);
if (params.has('nur')) document.body.classList.add('solo');
let cur = Math.min(8, Math.max(1, parseInt(location.hash.slice(1), 10) || 1)), actual = false;
const tabs = document.getElementById('tabs');
tabs.innerHTML = Object.keys(META).map((n) => `<button class="deck-tab" data-go="${n}" role="tab"><span class="n">${n}</span>${META[n][0]}</button>`).join('');
function fit() {
  const head = document.body.classList.contains('solo') ? 0 : document.querySelector('.deck-top').offsetHeight;
  const k = (actual || document.body.classList.contains('solo')) ? 1 : Math.min(1, (innerWidth - 48) / 1440, (innerHeight - head - 40) / 900);
  document.documentElement.style.setProperty('--k', Math.max(0.3, k));
}
function show(n) {
  cur = n;
  document.getElementById('screen').innerHTML = S[n]();
  document.getElementById('cap-title').textContent = `${n} · ${META[n][0]}`;
  document.getElementById('cap-list').innerHTML = META[n][1].map((t) => `<li>${esc(t)}</li>`).join('');
  tabs.querySelectorAll('.deck-tab').forEach((t) => t.setAttribute('aria-selected', String(+t.dataset.go === n)));
  if (location.hash !== '#' + n) history.replaceState(null, '', location.pathname + location.search + '#' + n);
  fit();
}
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-go]');
  if (el && el.dataset.go) show(+el.dataset.go);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') show(cur % 8 + 1);
  if (e.key === 'ArrowLeft') show((cur + 6) % 8 + 1);
});
document.getElementById('zoom').addEventListener('click', (e) => { actual = !actual; e.target.textContent = actual ? 'Einpassen' : 'Originalgröße'; fit(); });
addEventListener('resize', fit);
show(cur);
</script>
