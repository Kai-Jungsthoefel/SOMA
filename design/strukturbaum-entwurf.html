<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOMA Strukturbaum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Entwurf nach der Idee des Nutzers (2026-10-09, dritte Runde des Strukturbaums): Leiste in drei Gruppen,
   Parameters und Files, dann Analysis und Animation, dann Skills, getrennt durch Striche. Der Reiter Parts und der
   Umschalter oben links entfallen. Die Bauteile stehen als Strukturbaum ohne Hintergrund ganz oben links im Viewer:
   oben der Name des Modells, darunter Baumstriche, und erst direkt vor jedem Namen Auge und Transparenz.
   Der Baum ist in Modell, Analyse und Animation derselbe. Zurück zum Modell geht über das × in der Leiste unten im Bild.
   Farben wie Entwurf 2 (design/ui-entwurf-2.html): Orange Aktion und Auswahl, Violett Vorschau, Grün/Gelb/Rot Status,
   Blau (#5ea8ff) ist die Farbe des Lastfalls im Bild. Pinke Kreise sind Anmerkungen, kein Teil der Oberfläche. */
:root{
  --bg:#121417; --s1:#16181c; --s2:#1b1e23; --s3:#232830; --line:#262a31; --line2:#2d323a;
  --tx:#e6e8eb; --tx2:#a3acb6; --tx3:#7f8994; --term:#0f1114;
  --acc:#f29a38; --acc-tx:#f6b46a; --acc-tint:rgba(242,154,56,.14); --acc-line:rgba(242,154,56,.45);
  --vio:#9aa6ff;
  --ok:#5cc98b; --warn:#e8c547; --err:#f07470;
  --bc:#5ea8ff;
  --note:#e25bd6;
  --sans:'IBM Plex Sans','Segoe UI',system-ui,sans-serif; --mono:'IBM Plex Mono',Consolas,monospace;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --k:1;
}
*{box-sizing:border-box}
html,body{margin:0;background:#0b0c0e;color:var(--tx);font:13px/1.4 var(--sans)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
svg{display:block;flex-shrink:0}
b{font-weight:600}
code,.mono{font-family:var(--mono);font-size:.95em}

/* ---- Präsentation (wie Entwurf 2) ---- */
.deck-top{position:sticky;top:0;z-index:5;background:#0b0c0e;border-bottom:1px solid #1d2025}
.deck-head{display:flex;align-items:center;gap:18px;padding:10px 24px}
.deck-title{font-weight:600;font-size:14px;white-space:nowrap}
.deck-tabs{display:flex;gap:2px;flex-wrap:wrap}
.deck-tab{height:30px;padding:0 11px;border-radius:6px;color:var(--tx2);white-space:nowrap}
.deck-tab .n{color:var(--tx3);margin-right:6px}
.deck-tab[aria-selected=true]{background:var(--s3);color:var(--tx)}
.deck-tab[aria-selected=true] .n{color:var(--acc-tx)}
.deck-tools{margin-left:auto;display:flex;align-items:center;gap:14px;color:var(--tx3);font-size:12px;white-space:nowrap}
.deck-tools label{display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--tx2)}
.deck-tools input{accent-color:var(--note)}
.deck-cap{display:flex;gap:28px;align-items:baseline;padding:4px 24px 12px}
.deck-cap h2{margin:0;font-size:17px;font-weight:600;white-space:nowrap}
.deck-cap ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px 24px;color:var(--tx2)}
.deck-cap li{display:flex;gap:8px;align-items:flex-start;max-width:520px}
.deck-cap li .bul{width:5px;height:5px;margin:7px 6px 0 6px;border-radius:50%;background:var(--tx3);flex-shrink:0}
.stage{padding:16px 24px 40px;display:flex;justify-content:center}
.frame{width:calc(1600px * var(--k));height:calc(900px * var(--k));flex-shrink:0}
.screen{width:1600px;height:900px;transform:scale(var(--k));transform-origin:0 0;border-radius:10px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 0 1px #262a31}
.pin{position:absolute;z-index:50;width:22px;height:22px;border-radius:50%;background:var(--note);color:#fff;font:600 12px/22px var(--sans);text-align:center;box-shadow:0 0 0 3px rgba(226,91,214,.28),0 4px 10px rgba(0,0,0,.5);pointer-events:none}
.pin.s{position:static;display:inline-block;flex-shrink:0;width:20px;height:20px;font-size:11px;line-height:20px;box-shadow:none}
body.nonotes .pin:not(.s){display:none}
body.solo .deck-top{display:none}
body.solo .stage{padding:0}
body.solo .screen{border-radius:0;box-shadow:none}

/* ---- App: Grundbausteine (aus Entwurf 2) ---- */
.app{width:1600px;height:900px;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;position:relative}
.top{height:44px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding-right:12px;background:var(--s1);border-bottom:1px solid var(--line)}
.logo{width:56px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--acc);flex-shrink:0}
.docname{display:flex;align-items:center;gap:6px;height:30px;padding:0 8px;margin-left:-6px;border-radius:6px;color:var(--tx2)}
.docname b{font-size:14px;color:var(--tx)}
.savestate{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--tx2);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block}
.grow{flex-grow:1}
.c2{color:var(--tx2)} .c3{color:var(--tx3)} .small{font-size:12px}
.pill{display:flex;align-items:center;height:30px;border:1px solid var(--line2);border-radius:15px;background:var(--s2);white-space:nowrap}
.pill .main{display:flex;align-items:center;gap:8px;height:28px;padding:0 12px}
.pill .sep{width:1px;height:16px;background:var(--line2)}
.pill .auto{display:flex;align-items:center;gap:6px;height:28px;padding:0 12px 0 10px;color:var(--tx2)}
.btn{display:flex;align-items:center;gap:7px;height:30px;padding:0 10px;border:1px solid var(--line2);border-radius:6px;white-space:nowrap;flex-shrink:0}
.btn.sm{height:28px;padding:0 9px;font-size:12px;gap:6px}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#1b1206;font-weight:600;gap:10px;padding:0 12px}
.btn.primary .kbd{font-size:11px;font-weight:500;color:#5a3a12}
.btn.acc{background:var(--acc-tint);border-color:var(--acc-line);color:var(--acc-tx);font-weight:500}
.ibtn{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:var(--tx2);flex-shrink:0}
.ibtn.s{width:26px;height:26px}
.layout{display:flex;align-items:center;gap:2px;padding:2px;border:1px solid var(--line2);border-radius:8px}
.layout button{width:30px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:5px;color:var(--tx3)}
.layout button.on{background:var(--s3);color:var(--tx)}
.body{flex-grow:1;display:flex;min-height:0}
.rail{width:56px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;background:var(--s1);border-right:1px solid var(--line)}
.rail button{position:relative;width:48px;height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:8px;color:var(--tx2);text-align:center}
.rail button span{font-size:10px}
.rail button.on{background:var(--s3);color:var(--acc-tx)}
.rail-sep{width:32px;height:1px;background:#3d444e;margin:8px 0;flex-shrink:0}
.rail button .nd{position:absolute;top:7px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 2px var(--s1)}
.rail button.on .nd{box-shadow:0 0 0 2px var(--s3)}
.side{flex-shrink:0;display:flex;flex-direction:column;background:var(--s1);border-right:1px solid var(--line);min-height:0;position:relative}
.side-hd{height:40px;flex-shrink:0;display:flex;align-items:center;gap:4px;padding:0 6px 0 18px;border-bottom:1px solid var(--line)}
.side-hd b{font-size:13px}
.side-hd .cnt{color:var(--tx3);margin-left:6px}
.side-hd .back{display:flex;align-items:center;gap:5px;height:28px;padding:0 8px 0 4px;margin-left:-10px;border-radius:6px;color:var(--tx2)}
.side-hd .back .cnt{margin-left:2px}
.center{flex-grow:1;min-width:0;display:flex;flex-direction:column}
.vp{flex-grow:1;position:relative;overflow:hidden;background:radial-gradient(ellipse at 46% 48%,#272c34 0%,#1b1e23 62%,#16181c 100%)}
.vstage{position:absolute;left:0;top:0}
.float{background:rgba(24,27,31,.96);border:1px solid var(--line2);border-radius:10px;box-shadow:var(--shadow)}
.vtop{position:absolute;left:12px;right:12px;top:12px;display:flex;align-items:flex-start;gap:12px;z-index:3}
.vtop .cubespace{width:100px;flex-shrink:0}
.tools{display:flex;align-items:center;gap:2px;padding:3px;height:42px}
.tools button{display:flex;align-items:center;gap:7px;height:34px;padding:0 11px;border-radius:7px;white-space:nowrap;color:var(--tx)}
.tools.compact button{padding:0 9px}
.vsep{width:1px;height:20px;background:var(--line2);margin:0 4px;flex-shrink:0}
.cubebox{position:absolute;top:8px;right:12px;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:3}
.vbar{display:flex;flex-direction:column;gap:2px;padding:3px}
.vbar button{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:#c9ced4}
.seg{display:flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden;flex-shrink:0}
.seg button{height:28px;padding:0 10px;font-size:12px;color:var(--tx2);display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.seg button + button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--acc-tint);color:var(--acc-tx);font-weight:500}
.tl{height:44px;flex-shrink:0;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--s1);border-top:1px solid var(--line)}
.tl .lbl{display:flex;align-items:center;gap:7px;color:var(--tx2);font-size:12px;font-weight:500;flex-shrink:0}
.track{position:relative;height:44px;flex-grow:1}
.track .line{position:absolute;left:8px;right:64px;top:21px;height:2px;background:var(--line2);border-radius:1px}
.vd{position:absolute;top:15px;width:14px;height:14px;margin-left:-7px;display:flex;align-items:center;justify-content:center}
.vd i{width:8px;height:8px;border-radius:50%;background:var(--tx2)}
.vd.app i{background:var(--s1);box-shadow:inset 0 0 0 2px var(--tx2)}
.now{position:absolute;top:13px;right:0;height:18px;display:flex;align-items:center;gap:8px}
.now i{width:14px;height:14px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 2px var(--acc);display:flex;align-items:center;justify-content:center}
.now i::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--acc)}
.now span{font-size:12px;font-weight:500;color:var(--acc-tx)}
.agent{flex-shrink:0;display:flex;flex-direction:column;background:var(--term);border-left:1px solid var(--line);position:relative;min-width:0}
.tabs{height:40px;flex-shrink:0;display:flex;align-items:flex-end;gap:2px;padding:0 6px 0 8px;background:var(--s1);border-bottom:1px solid var(--line)}
.tab{height:33px;display:flex;align-items:center;gap:8px;padding:0 8px 0 10px;border-radius:7px 7px 0 0;color:var(--tx2);border:1px solid transparent;white-space:nowrap}
.tab.on{background:var(--term);border-color:var(--line);border-bottom-color:var(--term);margin-bottom:-1px;color:var(--tx);font-weight:500}
.tab .x{color:var(--tx3);display:flex}
.term{flex-grow:1;min-height:0;display:flex;flex-direction:column;padding:12px 14px;font-family:var(--mono);font-size:12.5px;line-height:1.6;color:#c9ced4;overflow:hidden}
.term .l{white-space:pre-wrap}
.term .gap{height:12px;flex-shrink:0}
.term .u{color:var(--tx)} .term .p{color:var(--acc-tx)} .term .cmd{color:#7fb4ff} .term .mut{color:var(--tx3)}
.term .bul{color:var(--ok)}
.term .inbox{margin-top:auto;border-top:1px solid #2b3038;border-bottom:1px solid #2b3038;padding:6px 0;color:var(--tx)}
.cursor{display:inline-block;width:7px;height:15px;margin-left:2px;background:var(--tx);vertical-align:-3px}
.menu{position:absolute;z-index:6;width:220px;padding:6px;background:var(--s2);border:1px solid var(--line2);border-radius:10px;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.mh{padding:6px 10px 6px;font-size:12px;color:var(--tx3)}
.mi{display:flex;align-items:center;gap:10px;height:30px;padding:0 10px;border-radius:6px;width:100%;white-space:nowrap}
.mi .ico{color:var(--tx2);display:flex}
.mi.on{background:var(--s3)}
.msep{height:1px;background:var(--line);margin:6px 4px}
.tag{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:4px;font-size:11px;font-weight:500;vertical-align:1px}
.tag.acc{background:var(--acc-tint);color:var(--acc-tx)}

/* ---- Strukturbaum ganz oben links im Viewer ----
   Ohne Hintergrund wie in CATIA: nur Schrift, Striche und Symbole, mit dunklem Rand, damit sie über jedem Teil und
   jeder Ergebnisfarbe lesbar bleiben. Nur die Zeile unter der Maus hellt leicht auf.
   Je Zeile erst die Baumstriche, dann Pfeil (Gruppe), Auge und Halbkreis, dann der Name. */
.tree{--trl:rgba(230,232,235,.3);position:absolute;left:12px;top:12px;z-index:4;display:flex;flex-direction:column;font-size:12.5px;color:var(--tx);font-variant-numeric:tabular-nums;white-space:nowrap;text-shadow:0 0 1px #0a0b0d,0 0 2px #0a0b0d,0 0 4px rgba(10,11,13,.9),0 0 8px rgba(10,11,13,.6)}
.tree svg{filter:drop-shadow(0 0 1px #0a0b0d) drop-shadow(0 0 2px #0a0b0d) drop-shadow(0 0 5px rgba(10,11,13,.7))}
.tree.open{width:252px}
.tr-hd{display:flex;align-items:center;gap:6px;height:28px;padding:0 4px}
.tr-hd .chev{width:14px;display:flex;justify-content:center;color:var(--tx2)}
.tr-hd .ico{display:flex;color:var(--tx2)}
.tr-hd b{font-weight:500}
.tr-hd .n{color:var(--tx2);font-size:12px}
.tr-hd .sp{flex:1}
.tr-hd .hb{width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:5px;color:var(--tx2)}
.tr-search{display:flex;align-items:center;gap:7px;height:30px;margin:0 0 4px;padding:0 3px 0 8px;border:1px solid var(--acc-line);border-radius:6px;background:var(--bg);color:var(--tx3);text-shadow:none}
.tr-search svg{filter:none}
.tr-search span{color:var(--tx)}
.tr-search .caret{display:inline-block;width:1px;height:14px;margin-left:1px;background:var(--tx);vertical-align:-2px}
.tr-search .hb{width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.tr-rows{padding:0 0 2px}
.tr-row{display:flex;align-items:center;height:24px;border-radius:5px;padding:0 8px 0 4px}
/* Baumstriche je Ebene: v läuft weiter, t zweigt ab, l zweigt als letzter ab, h führt bei Teilen bis zu den Knöpfen */
.tr-row .br{display:flex;align-self:stretch;flex-shrink:0}
.tr-row .br i{position:relative;width:14px}
.tr-row .br i::before,.tr-row .br i::after{box-shadow:0 0 0 1px rgba(10,11,13,.35)}
.tr-row .br i.v::before,.tr-row .br i.t::before{content:'';position:absolute;left:6px;top:0;bottom:0;width:1px;background:var(--trl)}
.tr-row .br i.l::before{content:'';position:absolute;left:6px;top:0;height:12px;width:1px;background:var(--trl)}
.tr-row .br i.t::after,.tr-row .br i.l::after{content:'';position:absolute;left:6px;right:0;top:12px;height:1px;background:var(--trl)}
.tr-row .br i.h::after{content:'';position:absolute;left:0;right:3px;top:12px;height:1px;background:var(--trl)}
.tr-row .chev{width:14px;display:flex;justify-content:center;color:var(--tx2);flex-shrink:0}
.tr-row .tg{width:20px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:5px;color:var(--tx2);opacity:.6;flex-shrink:0}
.tr-row .tg.gh{margin-right:5px}
.tr-row .tg.eye.on{opacity:1;color:var(--tx)}
.tr-row .tg.gh.on{opacity:1;color:var(--acc-tx)}
.tr-row .tg.gh.partly{opacity:.8;color:var(--acc-tx)}
.tr-row .nm{overflow:hidden;text-overflow:ellipsis}
.tr-row .cnt{margin-left:6px;color:var(--tx2);font-size:12px}
.tr-row.off .nm{color:var(--tx3)}
.tr-row.sel .nm{color:var(--acc-tx);font-weight:500}
.tr-row.hov{background:rgba(255,255,255,.09)} .tr-row.hov .tg{opacity:1}
.tr-ft{display:flex;align-items:center;gap:6px;height:26px;padding:0 4px;font-size:12px;color:var(--tx2)}
.tr-ft button{margin-left:auto;height:22px;padding:0 8px;border-radius:5px;color:var(--acc-tx)}

/* ---- Bericht (Analyse) und Ablauf (Animation) in der Seitenleiste, ruhig wie in Runde 2 ---- */
.cx{font-variant-numeric:tabular-nums}
.cx-scroll{flex:1;min-height:0;overflow:hidden;position:relative}
.cx-head{padding:16px 18px 0}
.cx-title{margin:0;font-size:14px;line-height:1.35;font-weight:600;color:var(--tx)}
.cx-meta{margin-top:3px;font-size:12px;color:var(--tx3)}
.cx-meta .w{color:var(--warn)}
.cx-sum{padding:18px 18px 16px}
.cx-num{display:flex;align-items:center;gap:12px}
.cx-num .n{font-size:30px;line-height:1;font-weight:500;color:var(--tx);letter-spacing:-.01em}
.cx-num .n small{font-size:14px;color:var(--tx2);margin-left:3px;font-weight:400;letter-spacing:0}
.cx-num .t{font-size:12.5px;line-height:1.35;color:var(--tx2)}
.cx-dim .cx-num,.cx-dim .cx-st,.cx-dim .cx-pr{opacity:.45}
.cx-num .t span{color:var(--tx3)}
.cx-st{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:var(--tx)}
.cx-st svg.bad{color:var(--err)} .cx-st svg.ok{color:var(--ok)}
.cx-pr{display:flex;align-items:center;gap:9px;height:28px;margin:0 -8px 0 -8px;padding:0 4px 0 30px;border-radius:6px;font-size:12.5px;color:var(--tx2)}
.cx-pr .dot{width:6px;height:6px}
.cx-pr .a{color:var(--tx3);margin-left:auto}
.cx-pr .v{color:var(--tx);width:36px;text-align:right}
.cx-pr .go{width:22px;height:22px;display:flex;align-items:center;justify-content:center;color:var(--tx3);visibility:hidden}
.cx-pr.hov{background:var(--s3)} .cx-pr.hov .go{visibility:visible;color:var(--tx)}
.cx-warn{display:flex;gap:8px;align-items:flex-start;margin-top:10px;font-size:12px;line-height:1.4;color:var(--tx2)}
.cx-warn svg{color:var(--warn);margin-top:1px}
.cx-warn u{text-decoration:none;color:var(--tx3);border-bottom:1px dotted var(--tx3);white-space:nowrap}
.cx-line{display:flex;gap:8px;align-items:center;margin:14px 18px 0;font-size:12px;color:var(--tx2)}
.cx-line svg{color:var(--warn)}
.cx-line button{margin-left:auto;color:var(--acc-tx);font-size:12px}
.cx-prog{position:relative;height:2px;margin:14px 18px 0;background:var(--s3);border-radius:1px;overflow:hidden}
.cx-prog i{position:absolute;left:20%;width:35%;top:0;bottom:0;background:var(--acc)}
.cx-sec{border-top:1px solid var(--line);padding:4px 0 8px}
.cx-sh{display:flex;align-items:center;gap:6px;height:32px;padding:0 14px 0 18px;font-size:11px;letter-spacing:.07em;color:var(--tx3)}
.cx-sh .r{margin-left:auto;letter-spacing:0;font-size:12px;display:flex;align-items:center;gap:4px;color:var(--tx3)}
.cx-sh .cnt{letter-spacing:0}
.cx-row{display:grid;grid-template-columns:64px 1fr 14px;align-items:center;gap:10px;min-height:30px;margin:0 6px;padding:0 8px 0 12px;border-radius:6px;font-size:13px}
.cx-row .l{color:var(--tx3);font-size:12.5px}
.cx-row .v{color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cx-row .v span{color:var(--tx3)}
.cx-row .ch{color:var(--tx3);display:flex;transition:transform .1s}
.cx-row.hov{background:var(--s3)}
.cx-row.open .ch{transform:rotate(90deg)}
.cx-det{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;margin:2px 18px 10px 92px;font-size:12px;color:var(--tx2)}
.cx-det dt{color:var(--tx3)} .cx-det dd{margin:0}
.cx-det .okc{color:var(--ok)} .cx-det .wc{color:var(--warn)}
.cx-det .sub{grid-column:1 / -1;color:var(--tx);margin-top:4px}
.cx-det .sub span{color:var(--tx3)}
.cx-tbl{width:calc(100% - 36px);margin:0 18px;border-collapse:collapse;font-size:12.5px}

function armShape(root, tip, hw, R, seg = 30) {

  const arm = (name, A, peak, w) => ({ name, poly: A.poly, z0: 2.5, z1: 7.5, sf: armF(A, peak), w, holes: motorHoles(A), depth: A.tip[0] * VW[0] + A.tip[1] * VW[1] });
  const stack = [[-15.25, -15.25], [15.25, -15.25], [-15.25, 15.25], [15.25, 15.25]].map(([x, y]) => [x, y, 1.6]);
  const arms = [arm('Arm vorn links', FL, 122.6, flW), arm('Arm vorn rechts', FR, 15.7), arm('Arm hinten links', RL, 17.0), arm('Arm hinten rechts', RR, 5.6)].sort((p, q) => p.depth - q.depth);
  const parts = [
    { name: 'Bodenplatte', poly: rrect(46, 130, 8), z0: 0, z1: 2.5, sf: plate([-21.5, 39], 129.1) },
    ...arms,
    { name: 'Mittelplatte', poly: rrect(40, 100, 6), z0: 7.5, z1: 9.5, sf: plate([-18.5, 36], 134.5), holes: [...stack, [0, 41, 2.2], [0, -41, 2.2], [-12, -41, 1.4], [12, -41, 1.4]] },
  ];
  for (const p of parts) { const dz = o.lift?.[p.name] || 0; p.z0 += dz; p.z1 += dz; }
  const hidden = new Set(o.hidden || []), ghost = new Set(o.ghost || []);
  const tipZ = 2.5 + (flW ? flW(...FL.tip) : 0), arrowLen = 40, showArrow = o.arrow !== false && !hidden.has('Arm vorn links');

  const all = [];

  if (o.arrow !== false) all.push(P([FL.tip[0], FL.tip[1], tipZ - arrowLen - 8]));
  const x0 = Math.min(...all.map((p) => p[0])), x1 = Math.max(...all.map((p) => p[0])), y0 = Math.min(...all.map((p) => p[1])), y1 = Math.max(...all.map((p) => p[1]));

  const ox = o.pad.l + (bw - (x1 - x0) * k) / 2 - x0 * k, oy = o.pad.t + (bh - (y1 - y0) * k) / 2 - y0 * k;

      if (n[0] * VW[0] + n[1] * VW[1] <= 0) continue;
      const wa = w(...a), wb = w(...b);

      const m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
      const c = rgb(colorAt(...m), 0.5 + 0.42 * Math.max(0, n[0] * LGT[0] + n[1] * LGT[1]));
      walls.push([m[0] * VW[0] + m[1] * VW[1], `<path d="M${q.map(fp).join('L')}Z" fill="${c}" stroke="${c}" stroke-width=".7"/>`]);

    }
    walls.sort((p, q) => p[0] - q[0]);
    const top = pts.map(([x, y]) => S([x, y, part.z1 + w(x, y)]));
    let cells = '';
    if (o.paint) cells = `<path d="M${top.map(fp).join('L')}Z" fill="${rgb(o.paint(part.name), 0.92)}"/>`;
    else {

        const cn = [[x, y], [x + cs, y], [x + cs, y + cs], [x, y + cs]];
        if (!inside([x + cs / 2, y + cs / 2], part.poly) && !cn.some((p) => inside(p, part.poly))) continue;
        const c = rgb(colorAt(x + cs / 2, y + cs / 2), 0.92);
        cells += `<path d="M${cn.map(([px, py]) => fp(S([px, py, part.z1 + w(px, py)]))).join('L')}Z" fill="${c}" stroke="${c}" stroke-width=".7"/>`;

      const ring = Array.from({ length: 22 }, (_, i) => { const t = i / 22 * 2 * Math.PI, x = hx + hr * Math.cos(t), y = hy + hr * Math.sin(t); return S([x, y, part.z1 + w(x, y)]); });

    svg += `<g${g}>${walls.map((x) => x[1]).join('')}<path d="${edges}" fill="none" stroke="#15171b" stroke-width="1.1"/>
      <clipPath id="${id}"><path d="M${top.map(fp).join('L')}Z"/></clipPath><g clip-path="url(#${id})">${cells}</g>${holes}
      <path d="M${top.map(fp).join('L')}Z" fill="none" stroke="#15171b" stroke-width="1.1" stroke-linejoin="round"/></g>`;
    if (g) svg += `<path d="M${top.map(fp).join('L')}Z" fill="none" stroke="rgba(230,232,235,.35)" stroke-width="1" stroke-linejoin="round"/>`;
  }
  const A = {};
  if (showArrow) {
    const head = S([FL.tip[0], FL.tip[1], tipZ]), tail = S([FL.tip[0], FL.tip[1], tipZ - arrowLen]), hl = 0.26 * arrowLen * k * CE;
    svg += `<g opacity=".96"><rect x="${(head[0] - 2.2).toFixed(1)}" y="${(head[1] + hl - 1).toFixed(1)}" width="4.4" height="${(tail[1] - head[1] - hl + 1).toFixed(1)}" fill="#5ea8ff"/>
      <path d="M${fp(head)}L${fp([head[0] - 7.5, head[1] + hl])}L${fp([head[0] + 7.5, head[1] + hl])}Z" fill="#5ea8ff"/></g>`;

  }

  A.bmin = S([-21.5, 39, 2.5]);
  A.mid = S([8, -12, 9.5 + (o.lift?.Mittelplatte || 0)]);
  A.k = k;
  return { svg: `<svg width="${o.W}" height="${o.H}" viewBox="0 0 ${o.W} ${o.H}">${svg}${o.extra ? o.extra(A) : ''}</svg>`, A };
}

const N = Object.keys(META).length;
let cur = Math.min(N - 1, Math.max(0, parseInt(location.hash.slice(1), 10) || 0)), actual = false;
const tabs = document.getElementById('tabs'), screenEl = document.getElementById('screen');
tabs.innerHTML = Object.keys(META).map((n) => `<button class="deck-tab" data-go="${n}" role="tab"><span class="n">${n}</span>${META[n][0]}</button>`).join('');
if (new URLSearchParams(location.search).has('nur')) document.body.classList.add('solo');
function fit() {
  const solo = document.body.classList.contains('solo'), head = solo ? 0 : document.querySelector('.deck-top').offsetHeight;
  const k = (actual || solo) ? 1 : Math.min(1, (innerWidth - 48) / 1600, (innerHeight - head - 40) / 900);
  document.documentElement.style.setProperty('--k', Math.max(0.3, k));
}
function placePins() {
  const root = screenEl.firstElementChild; if (!root) return;
  const k = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--k')) || 1, r0 = root.getBoundingClientRect();
  root.querySelectorAll('.pin:not(.s)').forEach((p) => p.remove());
  root.querySelectorAll('[data-pin]').forEach((el) => {
    const r = el.getBoundingClientRect(), pos = el.dataset.pinPos || 'tr';
    let x, y;
    if (pos === 'l' || pos === 'r') { x = pos === 'l' ? r.left - 14 * k : r.right + 14 * k; y = (r.top + r.bottom) / 2; }
    else if (pos === 'tc' || pos === 'bc') { x = (r.left + r.right) / 2; y = pos === 'tc' ? r.top - 5 * k : r.bottom + 5 * k; }
    else { x = pos.includes('r') ? r.right : r.left; y = pos.includes('b') ? r.bottom : r.top; }
    x = (x - r0.left) / k; y = (y - r0.top) / k;
    const p = document.createElement('span'); p.className = 'pin'; p.textContent = el.dataset.pin;
    p.style.left = `${Math.round(Math.min(1600 - 26, Math.max(4, x - 11)))}px`; p.style.top = `${Math.round(Math.min(900 - 26, Math.max(4, y - 11)))}px`;
    root.appendChild(p);
  });
}
function show(n) {
  cur = n;
  screenEl.innerHTML = S[n]();
  document.getElementById('cap-title').textContent = `${n} · ${META[n][0]}`;
  document.getElementById('cap-list').innerHTML = META[n][1].map(([p, t]) => `<li>${p ? `<span class="pin s">${p}</span>` : '<span class="bul"></span>'}<span>${t}</span></li>`).join('');
  tabs.querySelectorAll('.deck-tab').forEach((t) => t.setAttribute('aria-selected', String(+t.dataset.go === n)));
  if (location.hash !== '#' + n) history.replaceState(null, '', location.pathname + location.search + '#' + n);
  fit(); placePins();
}
document.addEventListener('click', (e) => { const el = e.target.closest('[data-go]'); if (el) show(+el.dataset.go); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') show((cur + 1) % N);
  if (e.key === 'ArrowLeft') show((cur + N - 1) % N);
});
document.getElementById('notes').addEventListener('change', (e) => document.body.classList.toggle('nonotes', !e.target.checked));
document.getElementById('zoom').addEventListener('click', (e) => { actual = !actual; e.target.textContent = actual ? 'Einpassen' : 'Originalgröße'; fit(); placePins(); });
addEventListener('resize', () => { fit(); placePins(); });
show(cur);
if (document.fonts) document.fonts.ready.then(placePins);
</script>
